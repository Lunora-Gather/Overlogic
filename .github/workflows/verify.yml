name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run verification
        run: npm run verify
      - name: Run balance gate
        run: npm run balance
      - name: Run product quality gate
        run: npm run quality-audit
      - name: Build release candidate
        run: npm run build
      - name: Audit release artifact
        run: npm run release-audit
      - name: Smoke test release over HTTP
        run: npm run http-audit
      - name: Enforce performance budgets
        run: npm run performance-audit

  deploy:
    if: github.event_name == 'push'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build versioned release
        run: npm run build
      - name: Audit deployed artifact
        run: npm run release-audit
      - name: Smoke test deployed artifact locally
        run: npm run http-audit
      - name: Re-check product quality
        run: npm run quality-audit
      - name: Re-check performance budgets
        run: npm run performance-audit
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - name: Deploy verified release
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
